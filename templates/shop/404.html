{% extends "shop/base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block meta_description %}The page you are looking for does not exist.{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center vh-100">
    <div class="text-center">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <p class="fs-4 text-muted mb-4">Oops! Page not found.</p>
        <p class="lead text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('product_list_endpoint') }}" class="btn btn-primary px-4">
            <i class="bi bi-house me-2"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
