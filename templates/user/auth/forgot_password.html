{% extends "shop/base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center bg-light">
  <div class="auth-card">
    <div class="card shadow border-0 rounded-3">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h4 class="fw-bold">Forgot Password</h4>
          <p class="text-muted small">Enter your email and we'll send you a reset link.</p>
        </div>

        {% if messages %}
          {% for m in messages %}
            <div class="alert alert-{{ m.tags }} alert-dismissible fade show">
              {{ m }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}

        <form method="post" action="{{ url_for('forgot_password_action') }}">
          <div class="mb-4">
            <label for="email" class="form-label small fw-semibold">Email</label>
            <input type="email"
                   id="email"
                   name="email"
                   class="form-control"
                   required
                   autofocus
                   autocomplete="email">
          </div>
          <button type="submit"
                  class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
                  x-data="{ loading: false }"
                  x-on:click="loading = true"
                  :disabled="loading">
            <span x-show="loading" class="spinner-border spinner-border-sm" role="status"></span>
            <span x-text="loading ? 'Sending...' : 'Send Reset Link'"></span>
          </button>
        </form>

        <div class="mt-3 text-center small">
          <a href="{{ url_for('login_page') }}">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
