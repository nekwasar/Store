{% extends "admin/home.html" %}

{% block title %}
    Admin categories list
{% endblock %}

{% block content1 %}
    <form action="{{ url_for('admin_objects_delete_endpoint', model='category') }}" method="post"
          x-data="checkboxList()">
        <div class="table-responsive">
        <table class="table table-hover text-center">
            <tr>
                <th scope="col"><label class="d-flex align-items-center gap-1" style="cursor:pointer; min-height:44px;"><input class="form-check-input" type="checkbox" id="masterCheckbox"
                                       @change="toggleAll" aria-label="delete"> Delete</label>
                </th>
                <th scope="col"></th>
                <th scope="col" class="text-start">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Slug</th>
            </tr>
            {% for category in categories %}
                <tr class="table-row align-middle" data-href="{{ url_for('admin_category_edit_endpoint', _id=category._id) }}">
                    <td><label style="display:flex; align-items:center; justify-content:center; min-height:44px; cursor:pointer;"><input class="form-check-input mt-0 childCheckbox" type="checkbox" name="delete"
                               @change="onChildChange" aria-label="to-delete-checkbox" value="{{ category._id }}"></label></td>
                    <td class="text-end" x-data="clipboardCopy('{{ category._id }}')">
                        <a href="#" @click.prevent="copy" data-bs-toggle="tooltip" data-bs-title="Click to copy ID"
                           class="text-decoration-none text-dark">⧉</a>
                    </td>
                    <td class="table-link-child text-start small">{{ category._id }}</td>
                    <td class="table-link-child">{{ category.name }}</td>
                    <td class="table-link-child">{{ category.slug }}</td>
                </tr>

            {% endfor %}
            <tr class="table-row">
                <td class="table-info table-link"
                    data-href="{{ url_for('admin_category_create_endpoint') }}" colspan="9">
                    Add new category
                </td>
            </tr>
            <tr class="table-row" style="transform: rotate(0);">
                <td colspan="10" class="table-danger p-0">
                    <button type="submit" class="btn stretched-link submit-button"
                            x-bind:disabled="!anyChecked">Delete selected
                    </button>
                </td>
            </tr>

        </table>
        </div>
    </form>
{% endblock %}
