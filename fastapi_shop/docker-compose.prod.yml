services:
  mongo:
    image: mongo:7
    restart: always
    env_file:
      - .env.mongo
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping | grep PONG
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  fastapi:
    build: .
    image: fastapi_shop:latest
    restart: always
    ports:
      - "${APP_PORT:-8989}:8989"
    env_file:
      - .env.project
    volumes:
      - static_volume:/code/static
      - ./logs:/code/logs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8989/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  celery_worker:
    image: fastapi_shop:latest
    restart: always
    command: celery -A celery_tasks:celery worker --loglevel=INFO --concurrency=2
    env_file:
      - .env.project
    volumes:
      - static_volume:/code/static
      - ./logs:/code/logs
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  celery_beat:
    image: fastapi_shop:latest
    restart: always
    command: celery -A celery_tasks:celery beat --loglevel=INFO
    env_file:
      - .env.project
    volumes:
      - ./logs:/code/logs
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      celery_worker:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
    depends_on:
      - fastapi
    healthcheck:
      test: curl -f http://localhost/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  static_volume:
